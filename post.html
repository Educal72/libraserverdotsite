  <script>
    // Hamburger menu
    const hamburger = document.querySelector('.VPNavBarHamburger');
    const navScreen = document.getElementById('VPNavScreen');

    hamburger.addEventListener('click', () => {
      const isOpen = hamburger.classList.toggle('active');
      hamburger.setAttribute('aria-expanded', isOpen);
      navScreen.style.display = isOpen ? 'block' : 'none';
      document.body.style.overflow = isOpen ? 'hidden' : '';
    });

    window.addEventListener('resize', () => {
      if (window.innerWidth >= 768) {
        navScreen.style.display = 'none';
        hamburger.classList.remove('active');
        hamburger.setAttribute('aria-expanded', 'false');
        document.body.style.overflow = '';
      }
    });

    // Mobile Extras toggle
    const mobileExtrasBtn = document.querySelector('.VPNavScreenMenuGroup .button');
    const mobileExtrasGroup = document.querySelector('.VPNavScreenMenuGroup');

    if (mobileExtrasBtn && mobileExtrasGroup) {
      mobileExtrasBtn.addEventListener('click', () => {
        mobileExtrasGroup.classList.toggle('open');
      });
    }

    // Desktop Extras dropdown
    const flyoutBtn = document.querySelector('.VPNavBarMenuGroup .button');
    const flyoutMenu = document.querySelector('.VPNavBarMenuGroup .menu');

    if (flyoutBtn && flyoutMenu) {
      flyoutBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = flyoutBtn.getAttribute('aria-expanded') === 'true';
        flyoutBtn.setAttribute('aria-expanded', String(!isOpen));
        flyoutMenu.style.opacity = isOpen ? '0' : '1';
        flyoutMenu.style.visibility = isOpen ? 'hidden' : 'visible';
        flyoutMenu.style.transform = 'translateY(0)';
        flyoutMenu.style.display = isOpen ? 'none' : 'block';
      });

      document.addEventListener('click', (e) => {
        if (
          !flyoutBtn.contains(e.target) &&
          !flyoutMenu.contains(e.target)
        ) {
          flyoutBtn.setAttribute('aria-expanded', 'false');
          flyoutMenu.style.opacity = '0';
          flyoutMenu.style.visibility = 'hidden';
          flyoutMenu.style.display = 'none';
        }
      });
    }

    const sunSVG = `<svg data-v-5da87d95="" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" viewBox="0 0 24 24" class="sun"><path d="M12,18c-3.3,0-6-2.7-6-6s2.7-6,6-6s6,2.7,6,6S15.3,18,12,18zM12,8c-2.2,0-4,1.8-4,4c0,2.2,1.8,4,4,4c2.2,0,4-1.8,4-4C16,9.8,14.2,8,12,8z"></path><path d="M12,4c-0.6,0-1-0.4-1-1V1c0-0.6,0.4-1,1-1s1,0.4,1,1v2C13,3.6,12.6,4,12,4z"></path><path d="M12,24c-0.6,0-1-0.4-1-1v-2c0-0.6,0.4-1,1-1s1,0.4,1,1v2C13,23.6,12.6,24,12,24z"></path><path d="M5.6,6.6c-0.3,0-0.5-0.1-0.7-0.3L3.5,4.9c-0.4-0.4-0.4-1,0-1.4s1-0.4,1.4,0l1.4,1.4c0.4,0.4,0.4,1,0,1.4C6.2,6.5,5.9,6.6,5.6,6.6z"></path><path d="M19.8,20.8c-0.3,0-0.5-0.1-0.7-0.3l-1.4-1.4c-0.4-0.4-0.4-1,0-1.4s1-0.4,1.4,0l1.4,1.4c0.4,0.4,0.4,1,0,1.4C20.3,20.7,20,20.8,19.8,20.8z"></path><path d="M3,13H1c-0.6,0-1-0.4-1-1s0.4-1,1-1h2c0.6,0,1,0.4,1,1S3.6,13,3,13z"></path><path d="M23,13h-2c-0.6,0-1-0.4-1-1s0.4-1,1-1h2c0.6,0,1,0.4,1,1S23.6,13,23,13z"></path><path d="M4.2,20.8c-0.3,0-0.5-0.1-0.7-0.3c-0.4-0.4-0.4-1,0-1.4l1.4-1.4c0.4-0.4,1-0.4,1.4,0s0.4,1,0,1.4l-1.4,1.4C4.7,20.7,4.5,20.8,4.2,20.8z"></path><path d="M18.4,6.6c-0.3,0-0.5-0.1-0.7-0.3c-0.4-0.4-0.4-1,0-1.4l1.4-1.4c0.4-0.4,1-0.4,1.4,0s0.4,1,0,1.4l-1.4,1.4C18.9,6.5,18.6,6.6,18.4,6.6z"></path></svg>`;

    const moonSVG = `<svg data-v-5da87d95="" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" viewBox="0 0 24 24" class="moon"><path d="M12.1,22c-0.3,0-0.6,0-0.9,0c-5.5-0.5-9.5-5.4-9-10.9c0.4-4.8,4.2-8.6,9-9c0.4,0,0.8,0.2,1,0.5c0.2,0.3,0.2,0.8-0.1,1.1c-2,2.7-1.4,6.4,1.3,8.4c2.1,1.6,5,1.6,7.1,0c0.3-0.2,0.7-0.3,1.1-0.1c0.3,0.2,0.5,0.6,0.5,1c-0.2,2.7-1.5,5.1-3.6,6.8C16.6,21.2,14.4,22,12.1,22zM9.3,4.4c-2.9,1-5,3.6-5.2,6.8c-0.4,4.4,2.8,8.3,7.2,8.7c2.1,0.2,4.2-0.4,5.8-1.8c1.1-0.9,1.9-2.1,2.4-3.4c-2.5,0.9-5.3,0.5-7.5-1.1C9.2,11.4,8.1,7.7,9.3,4.4z"></path></svg>`;

    const darkModeBtns = document.querySelectorAll('.CustomSwitchAppearance');

    function updateIcons(isDark) {
      darkModeBtns.forEach(btn => {
        btn.innerHTML = isDark ? moonSVG : sunSVG;
        btn.setAttribute('aria-checked', isDark);
      });
    }

    updateIcons(document.documentElement.classList.contains('dark'));

    darkModeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const isCurrentlyDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('vitepress-theme-appearance', isCurrentlyDark ? 'dark' : 'light');
        updateIcons(isCurrentlyDark);
      });
    });
  </script>

  <script>
    // ── Ghost Content API config ──────────────────────────────
    // Fill these in from Ghost Admin → Settings → Integrations → your custom integration
    const GHOST_URL = "https://ghost.educal.duckdns.org";   // Ghost's API URL, no trailing slash
    const GHOST_KEY = "a54fba8c83b943801a86abcfeb";
    // ────────────────────────────────────────────────────────────

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    async function loadPost() {
      const container = document.getElementById('post-container');
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');

      if (!slug) {
        container.innerHTML = '<p>No se especificó ninguna entrada.</p>';
        return;
      }

      if (!GHOST_KEY || GHOST_KEY.startsWith('PASTE_')) {
        container.innerHTML = '<p>Falta configurar la API key de Ghost.</p>';
        return;
      }

      try {
        const res = await fetch(
          `${GHOST_URL}/ghost/api/content/posts/slug/${encodeURIComponent(slug)}/?key=${GHOST_KEY}&include=tags,authors`
        );
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const post = data.posts && data.posts[0];

        if (!post) {
          container.innerHTML = '<p>Entrada no encontrada.</p>';
          return;
        }

        document.getElementById('page-title').textContent = `${post.title} | Libra`;

        const dateFmt = new Intl.DateTimeFormat('es-CR', { year: 'numeric', month: 'long', day: 'numeric' });
        const dateStr = post.published_at ? dateFmt.format(new Date(post.published_at)) : '';
        const img = post.feature_image
          ? `<img class="post-feature-img" src="${post.feature_image}" alt="${escapeHtml(post.title)}">`
          : '';

        // post.html from Ghost's Content API is already sanitized server-side HTML,
        // and inherits .vp-doc typography (h1-h6, p, a, blockquote, code, lists) from the site's own stylesheet
        container.innerHTML = `
          <p class="post-date">${dateStr}</p>
          <h1>${escapeHtml(post.title)}</h1>
          ${img}
          ${post.html || ''}
        `;
      } catch (err) {
        container.innerHTML = '<p>No se pudo cargar la entrada. Intenta de nuevo más tarde.</p>';
        console.error('Ghost fetch error:', err);
      }
    }

    loadPost();
  </script>
